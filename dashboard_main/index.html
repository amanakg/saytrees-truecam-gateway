<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Enarxi Cameras — Live Dashboard</title>
  <meta name="description" content="Enarxi production-grade live surveillance dashboard" />
  <link rel="stylesheet" href="./styles.css" />
</head>

<body>
  <div class="app-container">
    <header class="header">
      <div class="header-meta" style="margin-left: auto;">
        <div class="status-pill">
          <span class="indicator"></span>
          <span id="activeCamCount">0 Active</span>
        </div>
        <span class="clock" id="live-clock">--:--:--</span>
      </div>
    </header>

    <!-- Camera Grid -->
    <main class="camera-grid" id="camGrid">
      <!-- Dynamically populated by app.js -->
    </main>
  </div>

  <!-- Scripts -->
  <script src="./reader.js"></script>
  <script src="./player-embed.js"></script>
  <script src="./app.js"></script>
</body>
</html>
