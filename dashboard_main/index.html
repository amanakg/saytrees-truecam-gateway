<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Enarxi Cameras — Main Dashboard</title>
  <meta name="description" content="Enarxi main live surveillance dashboard" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  <script src="./reader.js"></script>

  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:        #07090f;
      --surface:   rgba(255,255,255,0.04);
      --border:    rgba(255,255,255,0.08);
      --accent:    #00c8ff;
      --accent2:   #0070f3;
      --red:       #ff4757;
      --green:     #2ed573;
      --yellow:    #ffa502;
      --text:      #e8eaf0;
      --muted:     #6b7280;
      --radius:    14px;
    }

    html, body {
      height: 100%;
      background: var(--bg);
      color: var(--text);
      font-family: 'Inter', system-ui, sans-serif;
      overflow: hidden;
    }

    /* ── Starfield background ── */
    body::before {
      content: '';
      position: fixed; inset: 0;
      background:
        radial-gradient(ellipse 80% 60% at 20% 10%, rgba(0,112,243,0.12) 0%, transparent 60%),
        radial-gradient(ellipse 60% 50% at 80% 90%, rgba(0,200,255,0.08) 0%, transparent 55%);
      pointer-events: none; z-index: 0;
    }

    .app {
      position: relative; z-index: 1;
      display: flex; flex-direction: column;
      height: 100vh; padding: 14px 18px 12px;
      gap: 12px;
    }

    /* ── Header ── */
    header {
      display: flex; align-items: center; justify-content: space-between;
      flex-shrink: 0;
    }

    .brand {
      display: flex; align-items: center; gap: 10px;
    }
    .brand-logo {
      width: 34px; height: 34px;
      background: linear-gradient(135deg, var(--accent2), var(--accent));
      border-radius: 8px;
      display: flex; align-items: center; justify-content: center;
      font-size: 18px;
    }
    .brand-name { font-size: 17px; font-weight: 700; letter-spacing: -0.3px; }
    .brand-name span { color: var(--accent); }

    .header-center {
      display: flex; align-items: center; gap: 10px;
    }

    .pill {
      display: flex; align-items: center; gap: 6px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 999px;
      padding: 5px 14px;
      font-size: 12px; font-weight: 500; color: var(--muted);
    }
    .pill .dot {
      width: 7px; height: 7px; border-radius: 50%;
      background: var(--green);
      box-shadow: 0 0 8px var(--green);
      animation: pulse 2s ease-in-out infinite;
    }
    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50%       { opacity: 0.4; }
    }

    #live-clock {
      font-size: 13px; font-weight: 500; color: var(--muted);
      font-variant-numeric: tabular-nums;
    }

    .header-actions {
      display: flex; gap: 8px;
    }

    /* ── Buttons ── */
    .btn {
      display: inline-flex; align-items: center; gap: 7px;
      padding: 7px 16px;
      border-radius: 8px;
      border: 1px solid var(--border);
      background: var(--surface);
      color: var(--text);
      font-size: 13px; font-weight: 500;
      cursor: pointer;
      transition: all .18s ease;
      white-space: nowrap;
    }
    .btn:hover {
      background: rgba(255,255,255,0.09);
      border-color: rgba(255,255,255,0.18);
    }
    .btn.primary {
      background: linear-gradient(135deg, var(--accent2), var(--accent));
      border-color: transparent;
      color: #fff;
    }
    .btn.primary:hover {
      filter: brightness(1.15);
    }
    .btn svg { flex-shrink: 0; }

    /* ── Camera grid ── */
    .grid {
      flex: 1; min-height: 0;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      transition: all .3s ease;
    }
    .grid.theater {
      grid-template-columns: 1fr 1fr;
    }

    /* ── Camera card ── */
    .cam-card {
      position: relative;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      overflow: hidden;
      display: flex; flex-direction: column;
      transition: box-shadow .2s, border-color .2s;
    }
    .cam-card:hover {
      border-color: rgba(0,200,255,0.25);
      box-shadow: 0 0 0 1px rgba(0,200,255,0.1), 0 20px 60px rgba(0,0,0,0.5);
    }
    .cam-card.focused {
      grid-column: 1 / -1;
    }

    /* ── Video wrapper ── */
    .video-wrap {
      flex: 1; min-height: 0;
      position: relative;
      background: #000;
    }
    video {
      width: 100%; height: 100%;
      object-fit: cover;
      display: block;
    }

    /* ── Overlay top-left: camera info ── */
    .cam-overlay-tl {
      position: absolute; top: 10px; left: 12px;
      display: flex; align-items: center; gap: 8px;
      pointer-events: none;
    }
    .status-dot {
      width: 8px; height: 8px; border-radius: 50%;
      background: var(--yellow);
      box-shadow: 0 0 8px var(--yellow);
      transition: background .3s, box-shadow .3s;
    }
    .status-dot.live   { background: var(--green); box-shadow: 0 0 10px var(--green); animation: pulse 2s infinite; }
    .status-dot.error  { background: var(--red);   box-shadow: 0 0 10px var(--red); }

    .cam-label {
      font-size: 12px; font-weight: 600;
      color: #fff;
      text-shadow: 0 1px 4px rgba(0,0,0,0.8);
      background: rgba(0,0,0,0.45);
      backdrop-filter: blur(6px);
      padding: 3px 9px; border-radius: 999px;
      border: 1px solid rgba(255,255,255,0.12);
    }

    /* ── Overlay top-right: time ── */
    .cam-overlay-tr {
      position: absolute; top: 10px; right: 12px;
      font-size: 11px; font-weight: 500;
      color: rgba(255,255,255,0.7);
      text-shadow: 0 1px 4px rgba(0,0,0,0.8);
      font-variant-numeric: tabular-nums;
      pointer-events: none;
    }

    /* ── Overlay bottom-left: stream metadata ── */
    .cam-overlay-bl {
      position: absolute; bottom: 12px; left: 12px;
      background: rgba(0, 0, 0, 0.6);
      backdrop-filter: blur(4px);
      border-radius: 4px;
      padding: 4px 8px;
      font-size: 11px;
      color: #e2e8f0;
      font-family: monospace;
      pointer-events: none;
      z-index: 10;
      display: none;
      border: 1px solid rgba(255, 255, 255, 0.08);
    }

    /* ── Status badge center ── */
    .cam-status-center {
      position: absolute; inset: 0;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      gap: 12px;
      background: rgba(0,0,0,0.6);
      backdrop-filter: blur(4px);
      pointer-events: none;
      opacity: 1;
      transition: opacity .5s;
    }
    .cam-status-center.hidden { opacity: 0; pointer-events: none; }

    .spinner {
      width: 36px; height: 36px;
      border: 3px solid rgba(255,255,255,0.1);
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: spin 0.9s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    .status-text { font-size: 13px; color: var(--muted); font-weight: 500; }
    .error-icon { font-size: 28px; }

    /* ── Bottom controls bar ── */
    .cam-footer {
      display: flex; align-items: center; justify-content: space-between;
      padding: 8px 12px;
      background: rgba(0,0,0,0.3);
      backdrop-filter: blur(8px);
      border-top: 1px solid var(--border);
      flex-shrink: 0;
    }

    .cam-footer-left {
      display: flex; align-items: center; gap: 10px;
    }
    .cam-name { font-size: 12px; font-weight: 600; color: var(--text); }
    .cam-id   { font-size: 10px; color: var(--muted); font-family: monospace; }

    .cam-footer-right {
      display: flex; gap: 6px;
    }

    .icon-btn {
      width: 30px; height: 30px;
      border-radius: 6px;
      border: 1px solid var(--border);
      background: rgba(255,255,255,0.05);
      display: flex; align-items: center; justify-content: center;
      cursor: pointer;
      color: var(--muted);
      transition: all .15s;
    }
    .icon-btn:hover {
      background: rgba(255,255,255,0.12);
      color: var(--text);
      border-color: rgba(255,255,255,0.2);
    }
    .icon-btn.active {
      background: rgba(0,200,255,0.15);
      border-color: rgba(0,200,255,0.4);
      color: var(--accent);
    }

    /* ── Theater / fullscreen overlay ── */
    .theater-overlay {
      display: none;
      position: fixed; inset: 0; z-index: 100;
      background: #000;
      flex-direction: column;
      align-items: stretch;
      padding: 0;
    }
    .theater-overlay.active {
      display: flex;
    }
    .theater-header {
      display: flex; align-items: center; justify-content: space-between;
      padding: 10px 20px;
      background: rgba(0,0,0,0.8);
      backdrop-filter: blur(10px);
      border-bottom: 1px solid var(--border);
      flex-shrink: 0;
    }
    .theater-title { font-size: 15px; font-weight: 600; }
    .theater-body {
      flex: 1; display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 4px;
      background: #111;
    }
    .theater-body video {
      width: 100%; height: 100%; object-fit: cover;
    }
    .theater-body .theater-slot {
      position: relative; background: #000;
      display: flex; align-items: center; justify-content: center;
    }
    .theater-slot-label {
      position: absolute; top: 10px; left: 14px;
      font-size: 12px; font-weight: 600;
      background: rgba(0,0,0,0.5); backdrop-filter: blur(6px);
      padding: 3px 10px; border-radius: 999px;
      border: 1px solid rgba(255,255,255,0.12);
    }

    /* ── Responsive ── */
    @media (max-width: 700px) {
      .grid { grid-template-columns: 1fr; }
      .brand-name, #live-clock { display: none; }
    }
    
    .debug-log-box {
      font-family: monospace;
      font-size: 11px;
      background: rgba(0,0,0,0.75);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 8px 12px;
      height: 85px;
      overflow-y: auto;
      color: #00c8ff;
      flex-shrink: 0;
      line-height: 1.5;
      backdrop-filter: blur(8px);
    }
  </style>
</head>
<body>

<div class="app">
  <!-- Header -->
  <header>
    <div class="brand">
      <div class="brand-logo">📹</div>
      <div class="brand-name">Enarxi <span>Cameras</span></div>
    </div>

    <div class="header-center">
      <div class="pill">
        <span class="dot"></span>
        <span id="activeCamCount">0 Cameras Active</span>
      </div>
      <span id="live-clock"></span>
    </div>

    <div class="header-actions">
      <button class="btn" id="refreshAllBtn" onclick="refreshAll()">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="1 4 1 10 7 10"/><path d="M3.51 15a9 9 0 1 0 .49-4.32"/></svg>
        Refresh All
      </button>
      <button class="btn primary" id="theaterBtn" onclick="openTheater()">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="3" width="20" height="14" rx="2"/><line x1="8" y1="21" x2="16" y2="21"/><line x1="12" y1="17" x2="12" y2="21"/></svg>
        Dual Fullscreen
      </button>
    </div>
  </header>

  <!-- Camera grid -->
  <div class="grid" id="camGrid">
  </div><!-- /grid -->
  
  <!-- Diagnostic Log Console Panel -->
  <div class="debug-log-box" id="debugLogBox">
    [Dashboard Debug] System ready. Awaiting camera connections...
  </div>
</div><!-- /app -->

<!-- Dual Fullscreen Theater Overlay -->
<div class="theater-overlay" id="theaterOverlay">
  <div class="theater-header">
    <span class="theater-title">📹 Enarxi Live — Dual Camera View</span>
    <div style="display:flex;gap:8px;align-items:center;">
      <span id="theaterClock" style="font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums;"></span>
      <button class="btn" onclick="closeTheater()">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
        Close
      </button>
    </div>
  </div>
  <div class="theater-body" id="theaterBody">
  </div>
</div>

<script src="./player-embed.js"></script>
<script>
  // Catch global errors and log them to the screen
  const debugLogs = [];
  function addDebugLog(msg, type = 'info') {
    console.log(`[Dashboard Debug] ${msg}`);
    debugLogs.unshift(`[${new Date().toLocaleTimeString()}] [${type.toUpperCase()}] ${msg}`);
    const logBox = document.getElementById('debugLogBox');
    if (logBox) {
      logBox.innerHTML = debugLogs.slice(0, 10).join('<br>');
    }
  }

  window.onerror = function (message, source, lineno, colno, error) {
    addDebugLog(`JS Error: ${message} (${lineno}:${colno})`, 'error');
  };

  // ── Stream configuration ──
  let CAMERAS = [];

  const playInstances  = {};   // main grid players (MediaMTXWebRTCReader instances)
  const tplayInstances = {};   // theater players

  // ── Live clock ──
  function updateClock() {
    const now = new Date();
    const s = now.toLocaleTimeString('en-IN', { hour12: false });
    const d = now.toLocaleDateString('en-IN', { day:'2-digit', month:'short', year:'numeric' });
    document.getElementById('live-clock').textContent = `${d}  ${s}`;
    CAMERAS.forEach(cam => {
      const el = document.getElementById(`clock${cam.id}`);
      if (el) el.textContent = s;
    });
    const tc = document.getElementById('theaterClock');
    if (tc) tc.textContent = `${d}  ${s}`;
  }
  setInterval(updateClock, 1000);
  updateClock();

  // ── WebRTC player setup using MediaMTX WHEP ──
  function setupPlayer(videoEl, whepUrl, camIdx, onLive, onError) {
    addDebugLog(`Connecting WebRTC for Cam ${camIdx}...`);
    return mountCameraPlayer(videoEl, whepUrl, {
      onLive: onLive,
      onError: (err) => {
        addDebugLog(`Cam ${camIdx} WebRTC Error: ${err}`, 'error');
        onError && onError(err);
      },
      onDebug: (msg, type) => {
        addDebugLog(`Cam ${camIdx}: ${msg}`, type);
      }
    });
  }

  // ── Set camera UI state ──
  function setCamState(idx, state, errorMsg = '') {
    const dot       = document.getElementById(`dot${idx}`);
    const statusBox = document.getElementById(`status${idx}`);
    const spinner   = document.getElementById(`spinner${idx}`);
    const txt       = document.getElementById(`statusText${idx}`);

    if (!dot || !statusBox || !spinner || !txt) return;

    dot.className = 'status-dot';
    statusBox.classList.remove('hidden');
    spinner.style.display = 'block';

    if (state === 'live') {
      dot.classList.add('live');
      statusBox.classList.add('hidden');
    } else if (state === 'error') {
      dot.classList.add('error');
      spinner.style.display = 'none';
      txt.textContent = `⚠ ${errorMsg || 'Stream offline — retrying…'}`;
    } else {
      txt.textContent = 'Connecting…';
    }
  }

  // ── Init a camera (main grid) ──
  function initCamera(cam) {
    const idx = cam.id;
    setCamState(idx, 'connecting');

    if (playInstances[idx]) {
      try { playInstances[idx].close(); } catch(e) {}
      delete playInstances[idx];
    }

    const video = document.getElementById(`video${idx}`);
    if (!video) return;
    video.srcObject = null; // Clear old source
    
    const reader = setupPlayer(
      video,
      cam.whepUrl,
      idx,
      () => setCamState(idx, 'live'),
      (err) => {
        setCamState(idx, 'error', err);
        // Auto-retry connection after 7s
        setTimeout(() => {
          if (playInstances[idx] === undefined) {
            initCamera(cam);
          }
        }, 7000);
      }
    );

    if (reader) playInstances[idx] = reader;
  }

  // ── Expand / collapse a camera card ──
  let expandedCam = null;
  function toggleExpand(idx) {
    const card = document.getElementById(`card${idx}`);
    const btn  = document.getElementById(`expandBtn${idx}`);

    if (expandedCam === idx) {
      // Collapse
      card.classList.remove('focused');
      CAMERAS.forEach(cam => {
        if (cam.id !== idx) {
          const other = document.getElementById(`card${cam.id}`);
          if (other) other.style.display = '';
        }
      });
      expandedCam = null;
      btn.classList.remove('active');
    } else {
      // Expand
      if (expandedCam !== null) {
        document.getElementById(`card${expandedCam}`).classList.remove('focused');
        document.getElementById(`expandBtn${expandedCam}`).classList.remove('active');
      }
      card.classList.add('focused');
      CAMERAS.forEach(cam => {
        if (cam.id !== idx) {
          const other = document.getElementById(`card${cam.id}`);
          if (other) other.style.display = 'none';
        }
      });
      expandedCam = idx;
      btn.classList.add('active');
    }
  }

  // ── Native fullscreen for a single video ──
  function goFullscreen(videoId) {
    const el = document.getElementById(videoId);
    if (!el) return;
    if (el.requestFullscreen)             el.requestFullscreen();
    else if (el.webkitRequestFullscreen)  el.webkitRequestFullscreen();
    else if (el.mozRequestFullScreen)     el.mozRequestFullScreen();
  }

  // ── Refresh a single camera ──
  function reloadCamera(idx) {
    const cam = CAMERAS.find(c => c.id === idx);
    if (!cam) return;
    initCamera(cam);
    if (tplayInstances[idx]) {
      try { tplayInstances[idx].close(); } catch(e) {}
      delete tplayInstances[idx];
      initTheaterCamera(cam);
    }
  }

  // ── Refresh all ──
  function refreshAll() {
    CAMERAS.forEach(cam => reloadCamera(cam.id));
  }

  // ── Theater mode ──
  function initTheaterCamera(cam) {
    const idx   = cam.id;
    const video = document.getElementById(`tvideo${idx}`);
    if (!video) return;
    video.srcObject = null;
    const reader = setupPlayer(video, cam.whepUrl, idx, null, null);
    if (reader) tplayInstances[idx] = reader;
  }

  function openTheater() {
    document.getElementById('theaterOverlay').classList.add('active');
    CAMERAS.forEach(cam => initTheaterCamera(cam));

    // Try to go browser fullscreen on the overlay
    const el = document.getElementById('theaterOverlay');
    if (el.requestFullscreen) el.requestFullscreen().catch(() => {});
  }

  function closeTheater() {
    document.getElementById('theaterOverlay').classList.remove('active');
    CAMERAS.forEach(cam => {
      if (tplayInstances[cam.id]) {
        try { tplayInstances[cam.id].close(); } catch(e) {}
        delete tplayInstances[cam.id];
      }
      const v = document.getElementById(`tvideo${cam.id}`);
      if (v) v.srcObject = null;
    });
    if (document.exitFullscreen) document.exitFullscreen().catch(() => {});
  }

  // ── ESC key closes theater ──
  document.addEventListener('keydown', (e) => {
    if (e.key === 'Escape') closeTheater();
  });

  // ── Dynamic DOM Creation ──
  function renderCameraDOM() {
    const grid = document.getElementById('camGrid');
    const theaterBody = document.getElementById('theaterBody');
    grid.innerHTML = '';
    theaterBody.innerHTML = '';
    document.getElementById('activeCamCount').textContent = `${CAMERAS.length} Cameras Active`;

    CAMERAS.forEach(cam => {
      const idx = cam.id;
      // Main Grid Card
      const card = document.createElement('div');
      card.className = 'cam-card';
      card.id = `card${idx}`;
      card.innerHTML = `
        <div class="video-wrap">
          <video id="video${idx}" autoplay muted playsinline></video>
          <div class="cam-overlay-tl">
            <div class="status-dot" id="dot${idx}"></div>
            <div class="cam-label">CAM ${idx}</div>
          </div>
          <div class="cam-overlay-tr" id="clock${idx}"></div>
          <div class="cam-overlay-bl" id="meta${idx}"></div>
          <div class="cam-status-center" id="status${idx}">
            <div class="spinner" id="spinner${idx}"></div>
            <div class="status-text" id="statusText${idx}">Connecting…</div>
          </div>
        </div>
        <div class="cam-footer">
          <div class="cam-footer-left">
            <div>
              <div class="cam-name">${cam.name}</div>
              <div class="cam-id">${cam.deviceId}</div>
            </div>
          </div>
          <div class="cam-footer-right">
            <button class="icon-btn" title="Refresh" onclick="reloadCamera(${idx})">
              <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><polyline points="1 4 1 10 7 10"/><path d="M3.51 15a9 9 0 1 0 .49-4.32"/></svg>
            </button>
            <button class="icon-btn" title="Expand" id="expandBtn${idx}" onclick="toggleExpand(${idx})">
              <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><polyline points="15 3 21 3 21 9"/><polyline points="9 21 3 21 3 15"/><line x1="21" y1="3" x2="14" y2="10"/><line x1="3" y1="21" x2="10" y2="14"/></svg>
            </button>
            <button class="icon-btn" title="Fullscreen" onclick="goFullscreen('video${idx}')">
              <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><polyline points="8 3 3 3 3 8"/><polyline points="21 8 21 3 16 3"/><polyline points="3 16 3 21 8 21"/><polyline points="16 21 21 21 21 16"/></svg>
            </button>
          </div>
        </div>
      `;
      grid.appendChild(card);

      // Theater Slot
      const tslot = document.createElement('div');
      tslot.className = 'theater-slot';
      tslot.innerHTML = `
        <video id="tvideo${idx}" autoplay muted playsinline></video>
        <div class="theater-slot-label" id="tlabel${idx}">${cam.name} · ${cam.deviceId}</div>
      `;
      theaterBody.appendChild(tslot);
    });
  }

  let isInitialized = false;

  // ── Dynamic Metadata Fetching from API ──
  async function fetchMetadata() {
    try {
      const response = await fetch('http://168.144.84.199:9000/api/clients/enarxi/cameras', {
        headers: {
          'x-api-key': 'dummy_hash_for_testing' // Replace with proper auth mechanism in production
        }
      });
      if (!response.ok) throw new Error(`HTTP error ${response.status}`);
      const data = await response.json();
      
      // Filter out mock cameras
      const realCameras = data.filter(c => !c.streamName.startsWith('mock_cam_'));

      // If list changed, re-render DOM
      if (realCameras.length !== CAMERAS.length || !isInitialized) {
        CAMERAS = realCameras.map((c, i) => ({
          id: i + 1,
          name: c.name,
          deviceId: c.id,
          whepUrl: c.whepUrl
        }));
        
        renderCameraDOM();
        
        // Clean old play instances
        Object.keys(playInstances).forEach(k => { try{ playInstances[k].close(); } catch(e){} delete playInstances[k]; });
        Object.keys(tplayInstances).forEach(k => { try{ tplayInstances[k].close(); } catch(e){} delete tplayInstances[k]; });
        
        CAMERAS.forEach(cam => initCamera(cam));
        isInitialized = true;
      }

      data.forEach(cam => {
        const matched = CAMERAS.find(c => c.deviceId === cam.id);
        if (matched) {
          const idx = matched.id;
          const metaDiv = document.getElementById(`meta${idx}`);
          const tlabel = document.getElementById(`tlabel${idx}`);
          
          if (cam.status === 'connected' && cam.metadata && cam.metadata.resolution) {
            const metaStr = `${cam.metadata.resolution} · ${cam.metadata.fps}fps · ${cam.metadata.codec.toUpperCase()}`;
            
            // Update main grid overlay
            if (metaDiv) {
              metaDiv.textContent = metaStr;
              metaDiv.style.display = 'block';
            }
            
            // Update theater view label
            if (tlabel) {
              tlabel.textContent = `${matched.name} · ${cam.id} (${metaStr})`;
            }
          } else {
            if (metaDiv) metaDiv.style.display = 'none';
            if (tlabel) {
              tlabel.textContent = `${matched.name} · ${cam.id}`;
            }
          }
        }
      });
    } catch (e) {
      console.warn('Failed to fetch camera metadata:', e.message);
    }
  }

  // Poll metadata every 5 seconds
  setInterval(fetchMetadata, 5000);
  fetchMetadata();
</script>
</body>
</html>
