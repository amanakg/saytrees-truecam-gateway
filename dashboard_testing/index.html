<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Testing Cameras — Mock Test Dashboard</title>
  <meta name="description" content="Enarxi mock testing dashboard" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  <script src="./reader.js"></script>

  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:        #07090f;
      --surface:   rgba(255,255,255,0.04);
      --border:    rgba(255,255,255,0.08);
      --accent:    #00c8ff;
      --accent2:   #0070f3;
      --red:       #ff4757;
      --green:     #2ed573;
      --yellow:    #ffa502;
      --text:      #e8eaf0;
      --muted:     #6b7280;
      --radius:    14px;
    }

    html, body {
      height: 100%;
      background: var(--bg);
      color: var(--text);
      font-family: 'Inter', system-ui, sans-serif;
      overflow: hidden;
    }

    /* ── Starfield background ── */
    body::before {
      content: '';
      position: fixed; inset: 0;
      background:
        radial-gradient(ellipse 80% 60% at 20% 10%, rgba(0,112,243,0.12) 0%, transparent 60%),
        radial-gradient(ellipse 60% 50% at 80% 90%, rgba(0,200,255,0.08) 0%, transparent 55%);
      pointer-events: none; z-index: 0;
    }

    .app {
      position: relative; z-index: 1;
      display: flex; flex-direction: column;
      height: 100vh; padding: 14px 18px 12px;
      gap: 12px;
    }

    /* ── Header ── */
    header {
      display: flex; align-items: center; justify-content: center;
      flex-shrink: 0;
    }

    .brand {
      display: flex; align-items: center; gap: 10px;
    }
    .brand-logo {
      width: 34px; height: 34px;
      background: linear-gradient(135deg, var(--accent2), var(--accent));
      border-radius: 8px;
      display: flex; align-items: center; justify-content: center;
      font-size: 18px;
    }
    .brand-name { font-size: 17px; font-weight: 700; letter-spacing: -0.3px; }
    .brand-name span { color: var(--accent); }

    .header-center {
      display: flex; align-items: center; gap: 10px;
    }

    .pill {
      display: flex; align-items: center; gap: 6px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 999px;
      padding: 5px 14px;
      font-size: 12px; font-weight: 500; color: var(--muted);
    }
    .pill .dot {
      width: 7px; height: 7px; border-radius: 50%;
      background: var(--green);
      box-shadow: 0 0 8px var(--green);
      animation: pulse 2s ease-in-out infinite;
    }
    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50%       { opacity: 0.4; }
    }

    #live-clock {
      font-size: 13px; font-weight: 500; color: var(--muted);
      font-variant-numeric: tabular-nums;
    }

    .header-actions {
      display: flex; gap: 8px;
    }

    /* ── Buttons ── */
    .btn {
      display: inline-flex; align-items: center; gap: 7px;
      padding: 7px 16px;
      border-radius: 8px;
      border: 1px solid var(--border);
      background: var(--surface);
      color: var(--text);
      font-size: 13px; font-weight: 500;
      cursor: pointer;
      transition: all .18s ease;
      white-space: nowrap;
    }
    .btn:hover {
      background: rgba(255,255,255,0.09);
      border-color: rgba(255,255,255,0.18);
    }
    .btn.primary {
      background: linear-gradient(135deg, var(--accent2), var(--accent));
      border-color: transparent;
      color: #fff;
    }
    .btn.primary:hover {
      filter: brightness(1.15);
    }
    .btn svg { flex-shrink: 0; }

    /* ── Layout ── */
    .layout-container {
      flex: 1; min-height: 0;
      display: flex;
      gap: 16px;
    }

    /* ── Sidebar ── */
    .sidebar {
      width: 260px;
      flex-shrink: 0;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      display: flex; flex-direction: column;
      overflow: hidden;
    }
    .sidebar-header {
      padding: 12px 16px;
      border-bottom: 1px solid var(--border);
      font-size: 13px; font-weight: 600; color: var(--muted);
      background: rgba(0,0,0,0.2);
    }
    .sidebar-list {
      flex: 1; overflow-y: auto;
      padding: 8px;
      display: flex; flex-direction: column; gap: 4px;
    }
    .sidebar-item {
      padding: 10px 12px;
      border-radius: 8px;
      cursor: pointer;
      display: flex; align-items: center; gap: 10px;
      transition: all 0.2s;
      border: 1px solid transparent;
      color: var(--text); font-size: 13px; font-weight: 500;
    }
    .sidebar-item:hover {
      background: rgba(255,255,255,0.05);
    }
    .sidebar-item.active {
      background: rgba(0, 200, 255, 0.1);
      border-color: rgba(0, 200, 255, 0.3);
      color: #fff;
    }
    .sidebar-item .dot {
      width: 8px; height: 8px; border-radius: 50%;
      background: var(--muted);
      transition: all 0.2s;
    }
    .sidebar-item.active .dot {
      background: var(--green);
      box-shadow: 0 0 8px var(--green);
      animation: pulse 2s ease-in-out infinite;
    }

    /* ── Main View ── */
    .main-view {
      flex: 1; min-width: 0;
      display: flex; flex-direction: column;
    }
    .main-view .cam-card {
      flex: 1; height: 100%;
    }

    /* ── Camera card ── */
    .cam-card {
      position: relative;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      overflow: hidden;
      display: flex; flex-direction: column;
      transition: box-shadow .2s, border-color .2s;
    }
    .cam-card:hover {
      border-color: rgba(0,200,255,0.25);
      box-shadow: 0 0 0 1px rgba(0,200,255,0.1), 0 20px 60px rgba(0,0,0,0.5);
    }
    .cam-card.focused {
      grid-column: 1 / -1;
    }

    /* ── Video wrapper ── */
    .video-wrap {
      flex: 1; min-height: 0;
      position: relative;
      background: #000;
    }
    video {
      width: 100%; height: 100%;
      object-fit: cover;
      display: block;
    }

    /* ── Overlay top-left: camera info ── */
    .cam-overlay-tl {
      position: absolute; top: 10px; left: 12px;
      display: flex; align-items: center; gap: 8px;
      pointer-events: none;
    }
    .status-dot {
      width: 8px; height: 8px; border-radius: 50%;
      background: var(--yellow);
      box-shadow: 0 0 8px var(--yellow);
      transition: background .3s, box-shadow .3s;
    }
    .status-dot.live   { background: var(--green); box-shadow: 0 0 10px var(--green); animation: pulse 2s infinite; }
    .status-dot.error  { background: var(--red);   box-shadow: 0 0 10px var(--red); }

    .cam-label {
      font-size: 12px; font-weight: 600;
      color: #fff;
      text-shadow: 0 1px 4px rgba(0,0,0,0.8);
      background: rgba(0,0,0,0.45);
      backdrop-filter: blur(6px);
      padding: 3px 9px; border-radius: 999px;
      border: 1px solid rgba(255,255,255,0.12);
    }

    /* ── Overlay top-right: time ── */
    .cam-overlay-tr {
      position: absolute; top: 10px; right: 12px;
      font-size: 11px; font-weight: 500;
      color: rgba(255,255,255,0.7);
      text-shadow: 0 1px 4px rgba(0,0,0,0.8);
      font-variant-numeric: tabular-nums;
      pointer-events: none;
    }

    /* ── Overlay bottom-left: stream metadata ── */
    .cam-overlay-bl {
      position: absolute; bottom: 12px; left: 12px;
      background: rgba(0, 0, 0, 0.6);
      backdrop-filter: blur(4px);
      border-radius: 4px;
      padding: 4px 8px;
      font-size: 11px;
      color: #e2e8f0;
      font-family: monospace;
      pointer-events: none;
      z-index: 10;
      display: none;
      border: 1px solid rgba(255, 255, 255, 0.08);
    }

    /* ── Status badge center ── */
    .cam-status-center {
      position: absolute; inset: 0;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      gap: 12px;
      background: rgba(0,0,0,0.6);
      backdrop-filter: blur(4px);
      pointer-events: none;
      opacity: 1;
      transition: opacity .5s;
    }
    .cam-status-center.hidden { opacity: 0; pointer-events: none; }

    .spinner {
      width: 36px; height: 36px;
      border: 3px solid rgba(255,255,255,0.1);
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: spin 0.9s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    .status-text { font-size: 13px; color: var(--muted); font-weight: 500; }
    .error-icon { font-size: 28px; }

    /* (Extra cams CSS removed for master-detail layout) */

    /* ── Bottom controls bar ── */
    .cam-footer {
      display: flex; align-items: center; justify-content: space-between;
      padding: 8px 12px;
      background: rgba(0,0,0,0.3);
      backdrop-filter: blur(8px);
      border-top: 1px solid var(--border);
      flex-shrink: 0;
    }

    .cam-footer-left {
      display: flex; align-items: center; gap: 10px;
    }
    .cam-name { font-size: 12px; font-weight: 600; color: var(--text); }
    .cam-id   { font-size: 10px; color: var(--muted); font-family: monospace; }

    .cam-footer-right {
      display: flex; gap: 6px;
    }

    .icon-btn {
      width: 30px; height: 30px;
      border-radius: 6px;
      border: 1px solid var(--border);
      background: rgba(255,255,255,0.05);
      display: flex; align-items: center; justify-content: center;
      cursor: pointer;
      color: var(--muted);
      transition: all .15s;
    }
    .icon-btn:hover {
      background: rgba(255,255,255,0.12);
      color: var(--text);
      border-color: rgba(255,255,255,0.2);
    }
    .icon-btn.active {
      background: rgba(0,200,255,0.15);
      border-color: rgba(0,200,255,0.4);
      color: var(--accent);
    }

    /* ── Theater / fullscreen overlay ── */
    .theater-overlay {
      display: none;
      position: fixed; inset: 0; z-index: 100;
      background: #000;
      flex-direction: column;
      align-items: stretch;
      padding: 0;
    }
    .theater-overlay.active {
      display: flex;
    }
    .theater-header {
      display: flex; align-items: center; justify-content: space-between;
      padding: 10px 20px;
      background: rgba(0,0,0,0.8);
      backdrop-filter: blur(10px);
      border-bottom: 1px solid var(--border);
      flex-shrink: 0;
    }
    .theater-title { font-size: 15px; font-weight: 600; }
    .theater-body {
      flex: 1; display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 4px;
      background: #111;
    }
    .theater-body video {
      width: 100%; height: 100%; object-fit: cover;
    }
    .theater-body .theater-slot {
      position: relative; background: #000;
      display: flex; align-items: center; justify-content: center;
    }
    .theater-slot-label {
      position: absolute; top: 10px; left: 14px;
      font-size: 12px; font-weight: 600;
      background: rgba(0,0,0,0.5); backdrop-filter: blur(6px);
      padding: 3px 10px; border-radius: 999px;
      border: 1px solid rgba(255,255,255,0.12);
    }

    /* ── Responsive ── */
    @media (max-width: 700px) {
      .grid { grid-template-columns: 1fr; }
      .brand-name, #live-clock { display: none; }
    }
    
    .debug-log-box {
      font-family: monospace;
      font-size: 11px;
      background: rgba(0,0,0,0.75);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 8px 12px;
      height: 85px;
      overflow-y: auto;
      color: #00c8ff;
      flex-shrink: 0;
      line-height: 1.5;
      backdrop-filter: blur(8px);
    }
  </style>
</head>
<body>

<div class="app">
  <!-- Header -->
  <header>
    <div class="header-center">
      <div style="display:flex; gap:8px; align-items:center; margin-right: 20px;">
        <span style="font-size: 13px; font-weight: 500;">Mock Cameras:</span>
        <input type="number" id="mockCountInput" value="5" min="1" max="100" style="padding: 6px; border-radius: 6px; background: rgba(255,255,255,0.1); border: 1px solid var(--border); color: #fff; width: 60px; outline: none; font-size: 13px;" />
        <button class="btn primary" onclick="startMockTest()">Start Test</button>
        <button class="btn" style="background: rgba(255,71,87,0.2); border-color: var(--red); color: #fff;" onclick="stopMockTest()">Stop Test</button>
      </div>
      <div class="pill">
        <span class="dot"></span>
        <span id="activeCamCount">0 Cameras Active</span>
      </div>
      <span id="live-clock"></span>
    </div>
  </header>

  <!-- Master-Detail Layout -->
  <div class="layout-container">
    <div class="sidebar">
      <div class="sidebar-header">Cameras List</div>
      <div class="sidebar-list" id="camSidebar"></div>
    </div>
    <div class="main-view" id="mainCamView">
      <div style="flex:1;display:flex;align-items:center;justify-content:center;color:var(--muted);font-weight:500;">
        Start a mock test to view cameras.
      </div>
    </div>
  </div>
</div><!-- /app -->

<!-- Dual Fullscreen Theater Overlay -->
<div class="theater-overlay" id="theaterOverlay">
  <div class="theater-header">
    <span class="theater-title">📹 Enarxi Live — Dual Camera View</span>
    <div style="display:flex;gap:8px;align-items:center;">
      <span id="theaterClock" style="font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums;"></span>
      <button class="btn" onclick="closeTheater()">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
        Close
      </button>
    </div>
  </div>
  <div class="theater-body" id="theaterBody">
  </div>
</div>

<script src="./player-embed.js"></script>
<script>
  // Catch global errors and log them to the screen
  const debugLogs = [];
  function addDebugLog(msg, type = 'info') {
    console.log(`[Dashboard Debug] ${msg}`);
    debugLogs.unshift(`[${new Date().toLocaleTimeString()}] [${type.toUpperCase()}] ${msg}`);
    const logBox = document.getElementById('debugLogBox');
    if (logBox) {
      logBox.innerHTML = debugLogs.slice(0, 10).join('<br>');
    }
  }

  window.onerror = function (message, source, lineno, colno, error) {
    addDebugLog(`JS Error: ${message} (${lineno}:${colno})`, 'error');
  };

  // ── Stream configuration ──
  let CAMERAS = [];
  let selectedCamId = null;

  const playInstances  = {};   // main grid players (MediaMTXWebRTCReader instances)
  const tplayInstances = {};   // theater players

  // ── Live clock ──
  function updateClock() {
    const now = new Date();
    const s = now.toLocaleTimeString('en-IN', { hour12: false });
    const d = now.toLocaleDateString('en-IN', { day:'2-digit', month:'short', year:'numeric' });
    document.getElementById('live-clock').textContent = `${d}  ${s}`;
    CAMERAS.forEach(cam => {
      const el = document.getElementById(`clock${cam.id}`);
      if (el) el.textContent = s;
    });
    const tc = document.getElementById('theaterClock');
    if (tc) tc.textContent = `${d}  ${s}`;
  }
  setInterval(updateClock, 1000);
  updateClock();

  // ── WebRTC player setup using MediaMTX WHEP ──
  function setupPlayer(videoEl, whepUrl, camIdx, onLive, onError) {
    addDebugLog(`Connecting WebRTC for Mock Cam ${camIdx}...`);
    return mountCameraPlayer(videoEl, whepUrl, {
      onLive: onLive,
      onError: (err) => {
        addDebugLog(`Mock Cam ${camIdx} WebRTC Error: ${err}`, 'error');
        onError && onError(err);
      },
      onDebug: (msg, type) => {
        addDebugLog(`Mock Cam ${camIdx}: ${msg}`, type);
      }
    });
  }

  // ── Set camera UI state ──
  function setCamState(idx, state, errorMsg = '') {
    const dot       = document.getElementById(`dot${idx}`);
    const statusBox = document.getElementById(`status${idx}`);
    const spinner   = document.getElementById(`spinner${idx}`);
    const txt       = document.getElementById(`statusText${idx}`);

    if (!dot || !statusBox || !spinner || !txt) return;

    dot.className = 'status-dot';
    statusBox.classList.remove('hidden');
    spinner.style.display = 'block';

    if (state === 'live') {
      dot.classList.add('live');
      statusBox.classList.add('hidden');
    } else if (state === 'error') {
      dot.classList.add('error');
      spinner.style.display = 'none';
      txt.textContent = `⚠ ${errorMsg || 'Stream offline — retrying…'}`;
    } else {
      txt.textContent = 'Connecting…';
    }
  }

  // ── Init a camera (main grid) ──
  function initCamera(cam) {
    const idx = cam.id;
    setCamState(idx, 'connecting');

    if (playInstances[idx]) {
      try { playInstances[idx].close(); } catch(e) {}
      delete playInstances[idx];
    }

    const video = document.getElementById(`video${idx}`);
    if (!video) return;
    video.srcObject = null; // Clear old source
    
    // Wait slightly to let ffmpeg spawn fully before trying to read whep
    setTimeout(() => {
      const reader = setupPlayer(
        video,
        cam.whepUrl,
        idx,
        () => setCamState(idx, 'live'),
        (err) => {
          setCamState(idx, 'error', err);
          // Auto-retry connection after 5s
          setTimeout(() => {
            if (playInstances[idx] === undefined) {
              initCamera(cam);
            }
          }, 5000);
        }
      );

      if (reader) playInstances[idx] = reader;
    }, 1500);
  }

  // ── Expand / collapse a camera card ──
  let expandedCam = null;
  function toggleExpand(idx) {
    const card = document.getElementById(`card${idx}`);
    const btn  = document.getElementById(`expandBtn${idx}`);

    if (expandedCam === idx) {
      // Collapse
      card.classList.remove('focused');
      CAMERAS.forEach(cam => {
        if (cam.id !== idx) {
          const other = document.getElementById(`card${cam.id}`);
          if (other) other.style.display = '';
        }
      });
      expandedCam = null;
      btn.classList.remove('active');
    } else {
      // Expand
      if (expandedCam !== null) {
        document.getElementById(`card${expandedCam}`).classList.remove('focused');
        document.getElementById(`expandBtn${expandedCam}`).classList.remove('active');
      }
      card.classList.add('focused');
      CAMERAS.forEach(cam => {
        if (cam.id !== idx) {
          const other = document.getElementById(`card${cam.id}`);
          if (other) other.style.display = 'none';
        }
      });
      expandedCam = idx;
      btn.classList.add('active');
    }
  }

  // ── Native fullscreen for a single video ──
  function goFullscreen(videoId) {
    const el = document.getElementById(videoId);
    if (!el) return;
    if (el.requestFullscreen)             el.requestFullscreen();
    else if (el.webkitRequestFullscreen)  el.webkitRequestFullscreen();
    else if (el.mozRequestFullScreen)     el.mozRequestFullScreen();
  }

  // ── Refresh a single camera ──
  function reloadCamera(idx) {
    const cam = CAMERAS.find(c => c.id === idx);
    if (!cam) return;
    initCamera(cam);
    if (tplayInstances[idx]) {
      try { tplayInstances[idx].close(); } catch(e) {}
      delete tplayInstances[idx];
      initTheaterCamera(cam);
    }
  }

  // ── Refresh all ──
  function refreshAll() {
    CAMERAS.forEach(cam => reloadCamera(cam.id));
  }

  // ── Theater mode ──
  function initTheaterCamera(cam) {
    const idx   = cam.id;
    const video = document.getElementById(`tvideo${idx}`);
    if (!video) return;
    video.srcObject = null;
    const reader = setupPlayer(video, cam.whepUrl, idx, null, null);
    if (reader) tplayInstances[idx] = reader;
  }

  function openTheater() {
    document.getElementById('theaterOverlay').classList.add('active');
    CAMERAS.forEach(cam => initTheaterCamera(cam));

    // Try to go browser fullscreen on the overlay
    const el = document.getElementById('theaterOverlay');
    if (el.requestFullscreen) el.requestFullscreen().catch(() => {});
  }

  function closeTheater() {
    document.getElementById('theaterOverlay').classList.remove('active');
    CAMERAS.forEach(cam => {
      if (tplayInstances[cam.id]) {
        try { tplayInstances[cam.id].close(); } catch(e) {}
        delete tplayInstances[cam.id];
      }
      const v = document.getElementById(`tvideo${cam.id}`);
      if (v) v.srcObject = null;
    });
    if (document.exitFullscreen) document.exitFullscreen().catch(() => {});
  }

  // ── ESC key closes theater ──
  document.addEventListener('keydown', (e) => {
    if (e.key === 'Escape') closeTheater();
  });

  // ── Dynamic DOM Creation ──
  function renderCameraDOM() {
    const sidebar = document.getElementById('camSidebar');
    const mainView = document.getElementById('mainCamView');
    const theaterBody = document.getElementById('theaterBody');
    
    if(sidebar) sidebar.innerHTML = '';
    if(theaterBody) theaterBody.innerHTML = '';
    
    document.getElementById('activeCamCount').textContent = `${CAMERAS.length} Cameras Active`;

    if (CAMERAS.length === 0) {
      if(mainView) mainView.innerHTML = `<div style="flex:1;display:flex;align-items:center;justify-content:center;color:var(--muted);font-weight:500;">Start a mock test to view cameras.</div>`;
      return;
    }

    if (!selectedCamId || !CAMERAS.find(c => c.id === selectedCamId)) {
      selectedCamId = CAMERAS[0].id;
    }

    // Render Sidebar List
    CAMERAS.forEach(cam => {
      const idx = cam.id;
      const isActive = idx === selectedCamId;
      
      const item = document.createElement('div');
      item.className = `sidebar-item ${isActive ? 'active' : ''}`;
      item.onclick = () => selectCamera(idx);
      item.innerHTML = `<div class="dot"></div>${cam.name}`;
      if(sidebar) sidebar.appendChild(item);
      
      // Render Theater Slots for first 4 cameras
      if (CAMERAS.indexOf(cam) < 4 && theaterBody) {
        const tslot = document.createElement('div');
        tslot.className = 'theater-slot';
        tslot.innerHTML = `
          <video id="tvideo${idx}" autoplay muted playsinline></video>
          <div class="theater-slot-label" id="tlabel${idx}">${cam.name} · ${cam.deviceId}</div>
        `;
        theaterBody.appendChild(tslot);
      }
    });

    // Render Main View
    const cam = CAMERAS.find(c => c.id === selectedCamId);
    if (!cam || !mainView) return;
    
    const idx = cam.id;
    mainView.innerHTML = `
      <div class="cam-card" id="card${idx}">
        <div class="video-wrap">
          <video id="video${idx}" autoplay muted playsinline></video>
          <div class="cam-overlay-tl">
            <div class="status-dot" id="dot${idx}"></div>
            <div class="cam-label">${cam.name}</div>
          </div>
          <div class="cam-overlay-tr" id="clock${idx}"></div>
          <div class="cam-overlay-bl" id="meta${idx}"></div>
          <div class="cam-status-center" id="status${idx}">
            <div class="spinner" id="spinner${idx}"></div>
            <div class="status-text" id="statusText${idx}">Connecting…</div>
          </div>
        </div>
        <div class="cam-footer">
          <div class="cam-footer-left">
            <div>
              <div class="cam-name">${cam.name}</div>
              <div class="cam-id">${cam.deviceId}</div>
            </div>
          </div>
          <div class="cam-footer-right">
            <button class="icon-btn" title="Refresh" onclick="reloadCamera(${idx})">
              <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><polyline points="1 4 1 10 7 10"/><path d="M3.51 15a9 9 0 1 0 .49-4.32"/></svg>
            </button>
            <button class="icon-btn" title="Fullscreen" onclick="goFullscreen('video${idx}')">
              <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><polyline points="8 3 3 3 3 8"/><polyline points="21 8 21 3 16 3"/><polyline points="3 16 3 21 8 21"/><polyline points="16 21 21 21 21 16"/></svg>
            </button>
          </div>
        </div>
      </div>
    `;

    // Start streaming the selected camera
    initCamera(cam);
  }

  window.selectCamera = function(idx) {
    if (selectedCamId === idx) return;
    
    // Close old stream
    if (playInstances[selectedCamId]) {
      try { playInstances[selectedCamId].close(); } catch(e) {}
      delete playInstances[selectedCamId];
    }
    
    selectedCamId = idx;
    renderCameraDOM();
  };

  // ── Mock Testing Logic ──
  function stopMockTest() {
    location.reload();
  }
  async function startMockTest() {
    const input = document.getElementById('mockCountInput');
    let count = parseInt(input.value, 10);
    if (isNaN(count) || count < 1) {
      alert("Please enter a valid number of mock cameras.");
      return;
    }

    addDebugLog(`Requesting ${count} mock cameras from backend...`);

    try {
      const res = await fetch('/api/test/mock_cameras', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ count })
      });
      
      if (!res.ok) throw new Error('Backend failed to start mock processes');
      
      const data = await res.json();
      addDebugLog(`Backend responded: ${data.message}`, 'success');

      // Clear existing players
      Object.keys(playInstances).forEach(k => { try{ playInstances[k].close(); } catch(e){} delete playInstances[k]; });
      Object.keys(tplayInstances).forEach(k => { try{ tplayInstances[k].close(); } catch(e){} delete tplayInstances[k]; });

      CAMERAS = [];
      for (let i = 1; i <= count; i++) {
        CAMERAS.push({
          id: i,
          name: `Mock Cam ${i}`,
          deviceId: `MOCK_CAM_${i}`,
          whepUrl: `http://168.144.84.199:8889/live/mock_cam_${i}/whep`
        });
      }

      renderCameraDOM();
      
      // (initCamera is now handled automatically by renderCameraDOM for the selected camera)

    } catch (err) {
      addDebugLog(err.message, 'error');
      alert("Error starting test: " + err.message);
    }
  }
</script>
</body>
</html>
