<script>
  function loadScript(src, attrs) {
    return new Promise((resolve, reject) => {
      try {
        let scriptEle = document.createElement('script')
        scriptEle.type = 'text/javascript'
        scriptEle.src = src
        for (let key in attrs) {
          scriptEle.setAttribute(key, attrs[key])
        }
        scriptEle.addEventListener('load', function () {
          resolve('success')
        })
        document.body.appendChild(scriptEle)
      } catch (err) {
        reject(err)
      }
    })
  }
  window.onload = async function () {
    window.isHardDecode = false
    if(typeof VideoDecoder != 'undefined'){
      const config = {
        codec: "hev1.1.6.L120.90", //"avc1.42001e"
        codedWidth: 1080,
        codedHeight: 720
      };
      let { supported } = await VideoDecoder.isConfigSupported(config);
      if(supported){ window.isHardDecode = true  }
    }
    // window.isHardDecode = false
    if (window.isHardDecode) {
      document.getElementById('currentDecodingMode').innerText = 'webcodecs'
      await loadScript("./nalu2mp4.js");
    } else {
      document.getElementById('currentDecodingMode').innerText = 'wasm'
      await loadScript("./jadecoder.js");
    }
    await loadScript('./play.js', {
      async: true
    })
    await loadScript('./index.js', {
      async: true
    })
    await loadScript('./cloud.js', {
      async: true
    })
  }
  
</script>
